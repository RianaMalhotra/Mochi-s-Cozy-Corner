name: Release Mochi (signed Windows updater)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate updater signing setup
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before releasing.' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Set TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets before releasing.' }
          $config = Get-Content src-tauri/tauri.conf.json -Raw
          if ($config.Contains('REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY')) { throw 'Replace the placeholder updater public key in src-tauri/tauri.conf.json before releasing.' }
      - name: Install dependencies
        run: npm install
      - name: Remove existing draft MSI assets before rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>&1
          if ($LASTEXITCODE -ne 0) {
            if (($releaseJson | Out-String) -match '(release not found|HTTP 404)') {
              Write-Host 'No existing release; continuing.'
              exit 0
            }
            throw "Unable to inspect existing release: $releaseJson"
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $env:RELEASE_TAG is already published; refusing to overwrite assets." }
          foreach ($asset in $release.assets) {
            if ($asset.name.EndsWith('.msi') -or $asset.name.EndsWith('.msi.sig') -or $asset.name -eq 'latest.json') {
              gh release delete-asset $env:RELEASE_TAG $asset.name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete old asset $($asset.name)" }
            }
          }
      - name: Build and publish signed Windows MSI update
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: "Mochi ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          releaseBody: 'Signed Windows installer and automatic updater artifacts.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: false
      - name: Ensure signed Windows updater manifest exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          $msi = @($release.assets | Where-Object { $_.name -like '*.msi' -and $_.name -notlike '*.msi.sig' }) | Select-Object -First 1
          if (-not $msi) { throw 'No MSI release asset found' }
          $sigPath = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi.sig' | Select-Object -First 1
          if (-not $sigPath) { throw 'No MSI signature found; refusing unsigned update manifest' }
          $signature = (Get-Content -LiteralPath $sigPath.FullName -Raw).Trim()
          if (-not $signature) { throw 'MSI signature is empty' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$([uri]::EscapeDataString($msi.name))"
          $manifest = @{
            version = $version
            notes = "Mochi $env:RELEASE_TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{ signature = $signature; url = $url }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath latest.json -Value $manifest -Encoding utf8
          gh release upload $env:RELEASE_TAG latest.json --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Uploaded latest.json pointing to signed $($msi.name)"
) {
              gh release delete-asset $env:RELEASE_TAG $asset.name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete old asset $($asset.name)" }
            }
          }
      - name: Build and publish signed Windows MSI update
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: "Mochi ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          releaseBody: 'Signed Windows installer and automatic updater artifacts.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: false
      - name: Ensure signed Windows updater manifest exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          $msi = @($release.assets | Where-Object { $_.name -like '*.msi' -and $_.name -notlike '*.msi.sig' }) | Select-Object -First 1
          if (-not $msi) { throw 'No MSI release asset found' }
          $sigPath = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi.sig' | Select-Object -First 1
          if (-not $sigPath) { throw 'No MSI signature found; refusing unsigned update manifest' }
          $signature = (Get-Content -LiteralPath $sigPath.FullName -Raw).Trim()
          if (-not $signature) { throw 'MSI signature is empty' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$([uri]::EscapeDataString($msi.name))"
          $manifest = @{
            version = $version
            notes = "Mochi $env:RELEASE_TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{ signature = $signature; url = $url }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath latest.json -Value $manifest -Encoding utf8
          gh release upload $env:RELEASE_TAG latest.json --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Uploaded latest.json pointing to signed $($msi.name)"
