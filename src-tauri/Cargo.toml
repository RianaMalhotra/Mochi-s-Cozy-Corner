[package]
name = "mochi_cozy_corner"
version = "0.2.1"
description = "Mochi — an animated floating desktop cat"
authors = ["Mochi contributors"]
edition = "2021"

[lib]
name = "mochi_cozy_corner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
